<!-- Define que el documento es un archivo HTML5 y utiliza el idioma español -->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configura la codificación de caracteres en UTF-8 para soportar tildes y eñes -->
    <meta charset="UTF-8">
    <!-- Configura la ventana gráfica (viewport) para que la página sea responsiva -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de la pestaña del navegador -->
    <title>Audiovisual - Milagros Bardiero</title>
    <!-- Vincula la hoja de estilos global CSS compartida con todo el sitio -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Importa la tipografía 'Plus Jakarta Sans' -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome: Importa la librería de íconos vectoriales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos específicos para la galería audiovisual, botones y ventana modal -->
    <style>
        /* Barra superior de controles sobre la cuadrícula de videos */
        .av-controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 2.5rem;
            margin-bottom: 1.5rem;
        }

        /* Estilo del botón para agregar un nuevo video */
        .btn-add-video {
            background: linear-gradient(135deg, #c7617b, #4a2135);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* Efecto al pasar el cursor sobre el botón de agregar video */
        .btn-add-video:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(199, 97, 123, 0.4);
        }

        /* Cuadrícula de 2 columnas para mostrar los videos */
        .av-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2.5rem;
        }

        /* Estilo de cada tarjeta contenedora de video */
        .av-card {
            background: linear-gradient(135deg, rgba(120, 50, 140, 0.2), rgba(30, 12, 45, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* Efecto de elevación en la tarjeta */
        .av-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Contenedor responsivo 16:9 que funciona tanto en local (file://) como en servidor */
        .video-thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Proporción panorámica 16:9 */
            background-color: #0d0611;
            display: block;
            overflow: hidden;
            text-decoration: none;
        }

        /* Imagen en alta definición de la portada del video de YouTube */
        .video-thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, filter 0.3s ease;
            filter: brightness(0.85);
        }

        /* Efecto de zoom sutil en la portada al pasar el mouse */
        .av-card:hover .video-thumbnail-wrapper img {
            transform: scale(1.04);
            filter: brightness(1);
        }

        /* Botón circular de Play centrado sobre la portada */
        .play-overlay-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background-color: rgba(217, 120, 143, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.4rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: background-color 0.2s, transform 0.2s;
            z-index: 2;
        }

        /* Efecto al pasar el cursor sobre la tarjeta en el botón Play */
        .av-card:hover .play-overlay-btn {
            background-color: #ffffff;
            color: #1a1a1a;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Etiqueta discreta indicando que se reproduce en YouTube */
        .yt-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            z-index: 2;
        }

        /* Pie de la tarjeta con el título del proyecto y el botón de eliminar */
        .av-card-info {
            padding: 1.3rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        /* Título del video */
        .av-card-info h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }

        /* Botón discreto para eliminar un video */
        .btn-delete-video {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
            flex-shrink: 0;
        }

        /* Efecto hover en el botón eliminar */
        .btn-delete-video:hover {
            background-color: #d9788f;
            color: #ffffff;
        }

        /* Fondo oscuro de la ventana emergente (Modal) para subir videos */
        .video-modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Caja central del formulario del modal */
        .video-modal-content {
            background-color: #24172c;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Encabezado del modal */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            color: #ffffff;
            margin: 0;
        }

        /* Botón cerrar (X) del modal */
        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        /* Grupo de campos del formulario */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        /* Campos de texto del formulario */
        .form-control {
            width: 100%;
            background-color: #130a17;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-pink);
        }

        /* Botón guardar dentro del modal */
        .btn-save-video {
            width: 100%;
            background: linear-gradient(135deg, #c7617b, #4a2135);
            color: #ffffff;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: opacity 0.2s;
        }

        .btn-save-video:hover {
            opacity: 0.9;
        }

        /* Adaptación responsiva a 1 columna en pantallas medianas y celulares */
        @media (max-width: 992px) {
            .av-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navbar: Barra de navegación superior -->
    <header class="header">
        <div class="nav-container">
            <!-- Logotipo con ícono de estrella que redirige al inicio (index.html) -->
            <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">
                <i class="fa-solid fa-star"></i>
                <span>Design</span>
            </a>
            <!-- Enlaces del menú -->
            <nav class="nav-links">
                <a href="index.html#portfolio">Portfolio</a>
                <a href="contacto.html" class="btn-contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- Main Content: Contenido principal de la página Audiovisual -->
    <main class="works-section" style="max-width: 1400px; margin: 3rem auto; padding: 0 3rem;">
        
        <!-- Banner grande principal de la categoría AUDIOVISUAL -->
        <div class="hero-banner category-banner">
            <div class="banner-gradient-overlay"></div>
            <div class="banner-content">
                <h2>AUDIOVISUAL</h2>
            </div>
        </div>

        <!-- Barra de acción con el botón para agregar nuevos videos -->
        <div class="av-controls">
            <button class="btn-add-video" onclick="openVideoModal()">
                <i class="fa-solid fa-plus"></i> Agregar video de YouTube
            </button>
        </div>

        <!-- Cuadrícula donde se renderizan automáticamente los videos -->
        <div class="av-grid" id="videosGrid">
            <!-- Los videos se cargan dinámicamente desde JavaScript -->
        </div>
    </main>

    <!-- Ventana Emergente (Modal) para ingresar el título y enlace del nuevo video -->
    <div class="video-modal" id="videoModal">
        <div class="video-modal-content">
            <div class="modal-header">
                <h3><i class="fa-brands fa-youtube" style="color: #ff0000; margin-right: 8px;"></i>Nuevo Video</h3>
                <button class="close-modal" onclick="closeVideoModal()">&times;</button>
            </div>
            <!-- Formulario que ejecuta addNewVideo() al enviarse -->
            <form onsubmit="addNewVideo(event)">
                <div class="form-group">
                    <label for="videoTitle">Título del proyecto</label>
                    <input type="text" id="videoTitle" class="form-control" placeholder="Ej: Cortometraje - Reflejos" required>
                </div>
                <div class="form-group">
                    <label for="videoUrl">Link de YouTube</label>
                    <input type="url" id="videoUrl" class="form-control" placeholder="https://youtu.be/..." required>
                </div>
                <button type="submit" class="btn-save-video">Agregar al Portfolio</button>
            </form>
        </div>
    </div>

    <!-- Pie de página (Footer) con información legal y enlaces reales a redes sociales -->
    <footer id="contacto" class="footer">
        <div class="footer-container">
            <div class="footer-info">
                <!-- Derechos de autor -->
                <p>&copy; 2026 Milagros S.A. | Todos los derechos reservados.</p>
                <!-- Enlaces legales secundarios -->
                <div class="footer-links">
                    <a href="#">Aviso Legal</a>
                    <span>|</span>
                    <a href="#">Política de Privacidad</a>
                    <span>|</span>
                    <a href="#">Términos de Servicio</a>
                    <span>|</span>
                    <a href="#">Configuración de Cookies</a>
                </div>
            </div>
            <!-- Íconos de redes sociales con apertura en pestaña nueva (sin Pinterest) -->
            <div class="social-icons">
                <a href="https://youtube.com/@milagrosbardiero?si=Zk3ajjh4WptoqSGk" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
                <a href="https://wa.me/5492245423598" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <a href="https://www.facebook.com/share/1FmeVSAi1S/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/milibardiero?rpxt=ZW5zcXpvbG1qbGdy" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- Lógica JavaScript para gestionar los videos de YouTube sin depender de Live Server -->
    <script>
        /* Arreglo inicial con tus dos primeros videos ya cargados por defecto */
        const videosList = [
            {
                title: "Elena - Bardiero Milagros",
                url: "https://youtu.be/ZPGGDrhhxEQ?si=d2fc50mUSQ087B5k"
            },
            {
                title: "NUESTRO HUMANO QUIERE SER MÙSICO - Bardiero Milagros",
                url: "https://youtu.be/ilEJ0ey2pUc?si=nvN-0j2Z494KwwDB"
            }
        ];

        /* Función que extrae automáticamente el ID de cualquier enlace de YouTube válido */
        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        /* Función que dibuja todas las tarjetas de video en la cuadrícula */
        function renderVideos() {
            const grid = document.getElementById('videosGrid');
            grid.innerHTML = ''; /* Limpia el contenido previo antes de volver a dibujar */

            videosList.forEach((video, index) => {
                const videoId = getYouTubeId(video.url);
                
                /* Si el enlace es válido, crea la tarjeta con la miniatura oficial HD y enlace directo */
                if (videoId) {
                    const card = document.createElement('div');
                    card.className = 'av-card';
                    
                    /* Usa la miniatura oficial de YouTube (hqdefault.jpg siempre existe y no falla en local) */
                    const thumbnailUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                    const watchUrl = `https://www.youtube.com/watch?v=${videoId}`;

                    card.innerHTML = `
                        <a href="${watchUrl}" target="_blank" rel="noopener noreferrer" class="video-thumbnail-wrapper" title="Ver en YouTube">
                            <img src="${thumbnailUrl}" alt="${video.title}">
                            <div class="play-overlay-btn">
                                <i class="fa-solid fa-play" style="margin-left: 3px;"></i>
                            </div>
                            <span class="yt-badge">
                                <i class="fa-brands fa-youtube" style="color: #ff4444;"></i> Ver en YouTube
                            </span>
                        </a>
                        <div class="av-card-info">
                            <h3>${video.title}</h3>
                            <button class="btn-delete-video" title="Eliminar video" onclick="deleteVideo(${index})">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });
        }

        /* Abre la ventana emergente para añadir un video nuevo */
        function openVideoModal() {
            document.getElementById('videoModal').style.display = 'flex';
        }

        /* Cierra la ventana emergente y limpia los campos del formulario */
        function closeVideoModal() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoUrl').value = '';
        }

        /* Procesa el formulario, valida el enlace de YouTube y agrega el nuevo video */
        function addNewVideo(event) {
            event.preventDefault(); /* Evita que la página se recargue al enviar el formulario */
            
            const title = document.getElementById('videoTitle').value.trim();
            const url = document.getElementById('videoUrl').value.trim();
            const videoId = getYouTubeId(url);

            /* Verifica que el enlace ingresado sea un link real de YouTube */
            if (!videoId) {
                alert("Por favor ingresá un enlace válido de YouTube (ej: https://youtu.be/... o https://www.youtube.com/watch?v=...)");
                return;
            }

            /* Agrega el nuevo video al arreglo y actualiza la vista */
            videosList.push({ title: title, url: url });
            renderVideos();
            closeVideoModal();
        }

        /* Elimina un video de la lista según su posición */
        function deleteVideo(index) {
            videosList.splice(index, 1);
            renderVideos();
        }

        /* Ejecuta el renderizado inicial apenas termina de cargar la página */
        window.addEventListener('DOMContentLoaded', renderVideos);
    </script>
</body>
</html>
