
<!-- Define el documento como HTML5 y establece el idioma español -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - Milagros Bardiero</title>

    <!-- Hoja de estilos global -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Estilos específicos del formulario -->
    <style>

        .contact-section {
            max-width: 1400px;
            margin: 4rem auto;
            padding: 0 3rem;
            display: flex;
            justify-content: center;
        }

        .contact-card {
            background-color: #ffffff;
            color: #1a1a1a;
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .contact-card h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .form-control {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #333;
            background-color: #f9fafb;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: #4a2135;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            background-color: #4a2135;
            color: white;
            border: none;
            padding: 0.9rem 2.5rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .btn-submit:hover {
            background-color: #351525;
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Mensajes de respuesta del formulario */
        .form-message {
            margin-top: 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }

        .form-message.success {
            display: block;
            color: #267346;
        }

        .form-message.error {
            display: block;
            color: #b42318;
        }

        /* Adaptación para celulares */
        @media (max-width: 600px) {

            .contact-section {
                padding: 0 1rem;
                margin: 2rem auto;
            }

            .contact-card {
                padding: 2rem 1.3rem;
            }

            .contact-card h2 {
                font-size: 1.5rem;
            }

        }

    </style>
</head>

<body>

    <!-- CABECERA -->
    <header class="header">

        <div class="nav-container">

            <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">
                <i class="fa-solid fa-star"></i>
                <span>Design</span>
            </a>

            <nav class="nav-links">
                <a href="index.html#portfolio">Portfolio</a>
                <a href="contacto.html" class="btn-contacto">Contacto</a>
            </nav>

        </div>

    </header>


    <!-- FORMULARIO DE CONTACTO -->
    <main class="contact-section">

        <div class="contact-card">

            <h2>Envíanos tu mensaje</h2>

            <form id="contact-form">

                <!-- Nombre -->
                <div class="form-group">

                    <label for="name">Nombre completo</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-control"
                        placeholder="Escribí tu nombre"
                        autocomplete="name"
                        required>

                </div>


                <!-- Correo electrónico -->
                <div class="form-group">

                    <label for="email">Correo electrónico</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Escribí tu correo"
                        autocomplete="email"
                        required>

                </div>


                <!-- Asunto -->
                <div class="form-group">

                    <label for="subject">Asunto</label>

                    <select
                        id="subject"
                        name="subject"
                        class="form-control"
                        required>

                        <option value="" disabled selected>
                            Seleccioná un asunto
                        </option>

                        <option value="Nuevo Proyecto">
                            Nuevo Proyecto
                        </option>

                        <option value="Colaboración">
                            Colaboración
                        </option>

                        <option value="Consulta General">
                            Consulta General
                        </option>

                    </select>

                </div>


                <!-- Mensaje -->
                <div class="form-group">

                    <label for="message">Mensaje</label>

                    <textarea
                        id="message"
                        name="message"
                        class="form-control"
                        placeholder="Contanos en qué podemos ayudarte"
                        required></textarea>

                </div>


                <!-- Botón enviar -->
                <button type="submit" class="btn-submit">
                    Enviar
                </button>

                <!-- Respuesta del formulario -->
                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

            </form>

        </div>

    </main>


    <!-- FOOTER -->
    <footer id="contacto" class="footer">

        <div class="footer-container">

            <div class="footer-info">

                <p>&copy; 2026 Milagros S.A. | Todos los derechos reservados.</p>

                <div class="footer-links">

                    <a href="#">Aviso Legal</a>
                    <span>|</span>
                    <a href="#">Política de Privacidad</a>
                    <span>|</span>
                    <a href="#">Términos de Servicio</a>
                    <span>|</span>
                    <a href="#">Configuración de Cookies</a>

                </div>

            </div>


            <!-- REDES SOCIALES -->
            <div class="social-icons">

                <a href="https://youtube.com/@milagrosbardiero?si=Zk3ajjh4WptoqSGk"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="YouTube">

                    <i class="fa-brands fa-youtube"></i>

                </a>

                <a href="https://wa.me/5492245423598"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="WhatsApp">

                    <i class="fa-brands fa-whatsapp"></i>

                </a>

                <a href="https://www.facebook.com/share/1FmeVSAi1S/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Facebook">

                    <i class="fa-brands fa-facebook-f"></i>

                </a>

                <a href="https://www.instagram.com/milibardiero?rpxt=ZW5zcXpvbG1qbGdy"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Instagram">

                    <i class="fa-brands fa-instagram"></i>

                </a>

            </div>

        </div>

    </footer>


    <!-- CONFIGURACIÓN Y ENVÍO CON EMAILJS -->
    <script>

        // Inicializar EmailJS
        emailjs.init({
            publicKey: 'u0vCnkBUOXGgRU2mt'
        });


        // Seleccionar el formulario
        const contactForm = document.getElementById('contact-form');

        const submitButton = contactForm.querySelector('.btn-submit');

        const formMessage = document.getElementById('form-message');


        // Detectar el envío del formulario
        contactForm.addEventListener('submit', function(event) {

            event.preventDefault();

            // Desactivar botón mientras se envía
            submitButton.disabled = true;
            submitButton.textContent = 'Enviando...';

            formMessage.className = 'form-message';
            formMessage.textContent = '';


            // Enviar los datos mediante EmailJS
            emailjs.sendForm(
                'service_exqp3fc',
                'template_acmm79r',
                this
            )

            .then(function(response) {

                console.log('Mensaje enviado:', response.status, response.text);

                // Mostrar confirmación
                formMessage.textContent = '¡Tu mensaje se envió correctamente! Gracias por contactarme.';
                formMessage.className = 'form-message success';

                // Limpiar los campos
                contactForm.reset();

            })

            .catch(function(error) {

                console.error('Error al enviar:', error);

                // Mostrar mensaje de error
                formMessage.textContent = 'No se pudo enviar el mensaje. Intentá nuevamente.';
                formMessage.className = 'form-message error';

            })

            .finally(function() {

                // Reactivar botón
                submitButton.disabled = false;
                submitButton.textContent = 'Enviar';

            });

        });

    </script>

</body>
</html>
